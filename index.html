    <meta name="theme-color" content="#ffffff" />

      content="Azubi Hub – zentrale Plattform für Auszubildende der Starke Automobilgruppe"
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Azubi Hub</title>
    <script>
      /* Theme vor dem ersten Paint anwenden – verhindert Dark-Mode-Blitzen */
      (function () {
        try {
          var t = localStorage.getItem('azubi-hub.theme') || 'system';
          var dark =
            t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
